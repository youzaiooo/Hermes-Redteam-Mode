name: hermes-redteam
version: 0.3.4
description: "Authorized red-team command console: commander + five permanent rt-* worker profiles, per-engagement fact store, Chinese desktop panel."
author: Youzai
kind: standalone
platforms:
  - linux
provides_tools:
  - redteam_engagement_open
  - redteam_session_bind
  - redteam_session_info
  - redteam_preflight
  - redteam_asset_query
  - redteam_asset_get
  - redteam_asset_stats
  - redteam_chain
  - redteam_chain_list
  - redteam_attack_chain
  - redteam_attack_path
  - redteam_score_list
  - redteam_score_report
  - redteam_report_index
  - redteam_report_export
  - redteam_sessions
  - redteam_agent_slot
  - redteam_dispatch
  - redteam_dispatch_status
provides_hooks:
  - pre_tool_call
